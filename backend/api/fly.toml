# fly.toml app configuration file generated for rahma-auth-api-2026 on 2026-10-07T20:44:10+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rahma-auth-api-2026'
primary_region = 'cdg'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  CORS_ORIGIN = 'https://auth-task-eight-beige.vercel.app'
  COOKIE_SECURE = 'true'
  COOKIE_SAME_SITE = 'none'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
