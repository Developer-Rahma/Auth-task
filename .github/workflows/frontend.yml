name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
      VITE_BASE_PATH: ${{ github.event_name == 'push' && format('/{0}/', github.event.repository.name) || '/' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate production API URL
        if: github.event_name == 'push'
        run: |
          if [ -z "$VITE_API_URL" ] || [ "$VITE_API_URL" = "http://localhost:3000" ]; then
            echo "::error::Set the VITE_API_URL repository variable to the deployed backend API origin."
            exit 1
          fi

      - name: Build for GitHub Pages
        if: github.event_name == 'push'
        run: npm run build:pages

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

  deploy:
    name: Deploy frontend to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
